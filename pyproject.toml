[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zion"
version = "0.1.0"
description = "Experimental runtime-independent state layer for AI agents"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0",
]

[project.scripts]
zion-mcp = "zion.mcp.server:main"

# Da dove setuptools deve raccogliere i pacchetti.
# Senza questa sezione vale l'auto-discovery: con il src-layout cerca
# solo dentro src/, e un pacchetto fuori da src/ non finisce nel wheel.
[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
mcp = [
    "mcp>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Copertura minima richiesta: sotto questa soglia i test falliscono.
addopts = "--cov=src/zion --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (errori veri), I: ordine import,
# B: bugbear (bug noti), UP: modernizzazioni compatibili con requires-python
select = ["E", "W", "F", "I", "B", "UP"]
